name: Sanity Test IRIS v2.0

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test_model:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Setup DVC
        uses: iterative/setup-dvc@v2

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Pull DVC artifacts (model + data)
        run: |
          dvc pull || echo "No DVC Remote Found"

      - name: Run unit tests
        run: |
          python -m unittest test.py -v | tee test_output.txt

      - name: Create report
        run: |
          echo "## ✅ Sanity Test Report" > report.md
          echo "### 🔹 Test Results" >> report.md
          cat test_output.txt >> report.md
          echo "" >> report.md
          echo "### 🔹 Metrics from Training" >> report.md
          cat artifacts/*/metrics.csv >> report.md

      - name: Publish CML report on PR
        uses: iterative/cml@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file: report.md
